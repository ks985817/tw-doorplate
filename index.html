<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>台灣官方門牌導航系統</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; background: #121212; }
    
    #map { height: 100%; width: 100%; z-index: 1; }
    
    #search-panel { position: absolute; top: 10px; left: 10px; right: 10px; background: rgba(30, 30, 30, 0.95); border-radius: 12px; padding: 12px; z-index: 1000; box-shadow: 0 4px 16px rgba(0,0,0,0.6); backdrop-filter: blur(10px); }
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
    select { background: #2b2b2b; color: #fff; border: 1px solid #495057; border-radius: 8px; padding: 10px 8px; font-size: 14px; flex: 1; min-width: 0; }
    .search-row { display: flex; gap: 8px; }
    .input-wrap { position: relative; display: flex; align-items: center; flex: 1; }
    input { width: 100%; padding: 13px 36px 13px 12px; font-size: 16px; border-radius: 8px; border: 1px solid #495057; background: #2b2b2b; color: #fff; }
    input:focus { outline: none; border-color: #4dabf7; }
    .clear-btn { position: absolute; right: 8px; background: none; border: none; color: #868e96; font-size: 18px; cursor: pointer; padding: 4px 6px; display: none; }
    .btn-search { background: #228be6; color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-size: 15px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn-search:active { background: #1c7ed6; }

    /* Google Maps 備用按鈕 */
    .gmap-bar { margin-top: 8px; display: flex; gap: 8px; }
    .btn-gmap { width: 100%; background: #25262b; color: #a5d8ff; border: 1px solid #373a40; border-radius: 8px; padding: 10px 12px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-gmap:active { background: #2c2e33; }

    .status-bar { font-size: 13px; color: #adb5bd; margin-top: 10px; min-height: 18px; text-align: center; }
    .dropdown { margin-top: 8px; background: #25262b; border: 1px solid #495057; border-radius: 10px; max-height: 40vh; overflow-y: auto; display: none; }
    .dropdown-item { padding: 12px; border-bottom: 1px solid #343a40; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:active { background: #2c2e33; }
    .item-addr { font-size: 15px; font-weight: 500; color: #f8f9fa; line-height: 1.35; }
    .badge-official { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600; background: rgba(43, 138, 62, 0.25); color: #69db7c; border: 1px solid #2b8a3e; margin-top: 4px; display: inline-block;}
    .badge-fallback { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600; background: rgba(240, 140, 0, 0.2); color: #ffd43b; border: 1px solid #e67700; margin-top: 4px; display: inline-block;}

    .leaflet-popup-content-wrapper { background: #1e1e1e; color: #fff; border-radius: 12px; }
    .leaflet-popup-tip { background: #1e1e1e; }
    .popup-content { text-align: center; padding: 4px 2px; }
    .popup-addr { font-size: 16px; font-weight: bold; margin-bottom: 4px; color: #f8f9fa; }
    .popup-coord { font-size: 12px; color: #868e96; margin-bottom: 12px; font-family: monospace; }
    .btn-nav-big { width: 100%; background: #2b8a3e; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-nav-big:active { background: #237032; }

    .locate-btn { position: absolute; bottom: 20px; right: 20px; z-index: 1000; background: #228be6; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .locate-btn:active { background: #1c7ed6; }
  </style>
</head>
<body>

  <div id="search-panel">
    <div class="toolbar">
      <select id="city-filter" onchange="onCityChange()"></select>
      <select id="town-filter" onchange="onTownChange()">
        <option value="">不限鄉鎮</option>
      </select>
    </div>
    <div class="search-row">
      <div class="input-wrap">
        <input type="text" id="addr" placeholder="例：朝昇東路80巷74弄1" autocomplete="off" oninput="onInputChange()" onkeydown="if(event.key==='Enter') triggerSearch()">
        <button class="clear-btn" id="clear-btn" onclick="clearInput()">✕</button>
      </div>
      <button class="btn-search" onclick="triggerSearch()">搜尋</button>
    </div>
    
    <div class="gmap-bar">
      <button class="btn-gmap" onclick="openGoogleMapsFuzzy()">🗺️ 找不到？改用 Google Maps 搜尋此地址 →</button>
    </div>

    <div class="status-bar" id="status">輸入地址，系統將自動為您補齊「號」並精準定位</div>
    <div class="dropdown" id="dropdown"></div>
  </div>

  <div id="map"></div>
  <button class="locate-btn" onclick="resetView()">🎯</button>

      "嘉義市": ["東區","西區"],

      "彰化縣": ["彰化市","鹿港鎮","和美鎮","線西鄉","伸港鄉","福興鄉","秀水鄉","花壇鄉","芬園鄉","員林市","溪湖鎮","田中鎮","大村鄉","埔鹽鄉","埔心鄉","永靖鄉","社頭鄉","二水鄉","北斗鎮","二林鎮","田尾鄉","埤頭鄉","芳苑鄉","大城鄉","竹塘鄉","溪州鄉"],
      "台中市": ["中區","東區","南區","西區","北區","北屯區","西屯區","南屯區","太平區","大里區","霧峰區","烏日區","豐原區","后里區","石岡區","東勢區","和平區","新社區","潭子區","大雅區","神岡區","大肚區","沙鹿區","龍井區","梧棲區","清水區","大甲區","外埔區","大安區"],
      "南投縣": ["南投市","埔里鎮","草屯鎮","竹山鎮","集集鎮","名間鄉","鹿谷鄉","中寮鄉","魚池鄉","國姓鄉","水里鄉","信義鄉","仁愛鄉"],
      "苗栗縣": ["苗栗市","頭份市","苑裡鎮","通霄鎮","竹南鎮","後龍鎮","卓蘭鎮","大湖鄉","公館鄉","銅鑼鄉","南庄鄉","頭屋鄉","三義鄉","西湖鄉","造橋鄉","三灣鄉","獅潭鄉","泰安鄉"],
      "新竹縣": ["竹北市","竹東鎮","新埔鎮","關西鎮","湖口鄉","新豐鄉","芎林鄉","橫山鄉","北埔鄉","寶山鄉","峨眉鄉","尖石鄉","五峰鄉"],
      "新竹市": ["東區","北區","香山區"],
      "桃園市": ["桃園區","中壢區","平鎮區","八德區","楊梅區","蘆竹區","大溪區","龍潭區","龜山區","大園區","觀音區","新屋區","復興區"],
      "新北市": ["板橋區","三重區","中和區","永和區","新莊區","新店區","樹林區","鶯歌區","三峽區","淡水區","汐止區","瑞芳區","土城區","蘆洲區","五股區","泰山區","林口區","深坑區","石碇區","坪林區","三芝區","石門區","八里區","平溪區","雙溪區","貢寮區","金山區","萬里區","烏來區"],
      "台北市": ["中正區","大同區","中山區","松山區","大安區","萬華區","信義區","士林區","北投區","內湖區","南港區","文山區"],
      "基隆市": ["仁愛區","信義區","中正區","中山區","安樂區","暖暖區","七堵區"],
      "宜蘭縣": ["宜蘭市","羅東鎮","蘇澳鎮","頭城鎮","礁溪鄉","壯圍鄉","員山鄉","冬山鄉","五結鄉","三星鄉","大同鄉","南澳鄉"],
      "花蓮縣": ["花蓮市","鳳林鎮","玉里鎮","新城鄉","吉安鄉","壽豐鄉","光復鄉","豐濱鄉","瑞穗鄉","富里鄉","秀林鄉","萬榮鄉","卓溪鄉"],
      "台東縣": ["臺東市","成功鎮","關山鎮","卑南鄉","鹿野鄉","池上鄉","東河鄉","長濱鄉","太麻里鄉","大武鄉","綠島鄉","海端鄉","延平鄉","金峰鄉","達仁鄉","蘭嶼鄉"],
      "澎湖縣": ["馬公市","湖西鄉","白沙鄉","西嶼鄉","望安鄉","七美鄉"],
      "金門縣": ["金城鎮","金湖鎮","金沙鎮","金寧鄉","烈嶼鄉","烏坵鄉"],
      "連江縣": ["南竿鄉","北竿鄉","莒光鄉","東引鄉"]
    };


    let map = null;
    let markerLayer = null;
    let currentResults = [];
    let debounceTimer = null;

    function init() {
      const citySelect = document.getElementById('city-filter');
      const townSelect = document.getElementById('town-filter');
      Object.keys(TW_DATA).forEach(city => {
        const opt = document.createElement('option');
        opt.value = city;
        opt.textContent = city || '全台灣（不限縣市）';
        citySelect.appendChild(opt);
      });

      citySelect.value = localStorage.getItem('doorplate_city_v10') || '屏東縣';
      populateTowns(citySelect.value);
      const savedTown = localStorage.getItem('doorplate_town_v10');
      if (savedTown && TW_DATA[citySelect.value]?.includes(savedTown)) {
        townSelect.value = savedTown;
      }

      map = L.map('map', { zoomControl: false }).setView([22.5505, 120.5435], 14); 
      
      // 內政部 EMAP 底圖
      L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
        maxZoom: 20,
        attribution: '© 內政部國土測繪中心'
      }).addTo(map);

      markerLayer = L.featureGroup().addTo(map);
    }

    function resetView() {
      map.setView([22.5505, 120.5435], 14);
    }

    function populateTowns(city) {
      const townSelect = document.getElementById('town-filter');
      townSelect.innerHTML = '<option value="">不限鄉鎮</option>';
      (TW_DATA[city] || []).forEach(town => {
        const opt = document.createElement('option');
        opt.value = town;
        opt.textContent = town;
        townSelect.appendChild(opt);
      });
    }

    function onCityChange() {
      const city = document.getElementById('city-filter').value;
      localStorage.setItem('doorplate_city_v10', city);
      localStorage.setItem('doorplate_town_v10', '');
      populateTowns(city);
    }

    function onTownChange() {
      localStorage.setItem('doorplate_town_v10', document.getElementById('town-filter').value);
    }

    function onInputChange() {
      const input = document.getElementById('addr');
      document.getElementById('clear-btn').style.display = input.value ? 'block' : 'none';
      
      // 延長延遲時間至 800ms，避免打字過程中過度呼叫被封鎖
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(triggerSearch, 800); 
    }

    function clearInput() {
      const input = document.getElementById('addr');
      input.value = '';
      document.getElementById('clear-btn').style.display = 'none';
      document.getElementById('dropdown').style.display = 'none';
      document.getElementById('status').innerText = '輸入地址，系統將自動為您補齊「號」並精準定位';
      markerLayer.clearLayers();
      input.focus();
    }

    // 多重 Proxy 輪替機制，確保一定能穿透 CORS 限制
    async function fetchNLSCWithFallback(queryStr) {
      const targetUrl = `https://api.nlsc.gov.tw/idc/TextQueryMap/${encodeURIComponent(queryStr)}/10`;
      
      const proxies = [
        { url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`, type: 'text' },
        { url: `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`, type: 'json' },
        { url: `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`, type: 'text' }
      ];

      for (let proxy of proxies) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 4000);
          
          const res = await fetch(proxy.url, { signal: controller.signal, cache: 'no-store' });
          clearTimeout(timeoutId);
          
          if (!res.ok) continue;

          let xmlStr = '';
          if (proxy.type === 'json') {
            const data = await res.json();
            if (!data.contents) continue;
            xmlStr = data.contents;
          } else {
            xmlStr = await res.text();
          }

          if (xmlStr.includes('<ITEM>')) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlStr, "text/xml");
            const items = Array.from(xml.getElementsByTagName("ITEM"));
            return items.map(item => {
              const content = item.getElementsByTagName("CONTENT")[0]?.textContent || '';
              const location = item.getElementsByTagName("LOCATION")[0]?.textContent || '';
              const [lng, lat] = location.split(',');
              return {
                addr: content,
                lat: parseFloat(lat).toFixed(6),
                lng: parseFloat(lng).toFixed(6),
                source: 'official'
              };
            }).filter(i => i.lat && i.lng && !isNaN(i.lat));
          }
        } catch (e) {
          console.warn('Proxy failed, trying next...', e);
          continue;
        }
      }
      return []; // 若全部失敗回傳空陣列
    }

    // 備用圖資引擎（用於官方系統連線異常時）
    async function fetchArcGIS(fullQuery) {
      try {
        const url = `https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?SingleLine=${encodeURIComponent(fullQuery)}&countryCode=TWN&outFields=Match_addr,Addr_type&maxLocations=5&f=json`;
        const res = await fetch(url);
        const data = await res.json();
        return (data.candidates || []).map(c => ({
          addr: c.address,
          lat: Number(c.location.y).toFixed(6),
          lng: Number(c.location.x).toFixed(6),
          source: 'fallback'
        }));
      } catch (e) {
        return [];
      }
    }

    async function triggerSearch() {
      let raw = document.getElementById('addr').value
        .replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .replace(/\s+/g, '').trim();

      const city = document.getElementById('city-filter').value;
      const town = document.getElementById('town-filter').value;
      const status = document.getElementById('status');
      const dropdown = document.getElementById('dropdown');

      if (raw.length < 2) {
        status.innerText = '請輸入門牌地址（例如：朝昇東路80巷74弄1）';
        return;
      }

      // 核心修正：自動偵測若結尾是數字且沒有「號」字，自動補上
      // 這樣輸入「74弄1」就會自動變成「74弄1號」，內政部系統才查得到
      if (/\d$/.test(raw)) {
        raw += '號';
      }

      let queryStr = raw;
      if (city && !raw.includes(city)) queryStr = city + queryStr;
      if (town && !raw.includes(town)) queryStr = queryStr.replace(city, city + town);

      status.innerText = `正在向內政部資料庫嚴格查詢「${queryStr}」...`;
      dropdown.style.display = 'none';
      markerLayer.clearLayers();

      try {
        // 先嘗試官方多重代理系統
        let results = await fetchNLSCWithFallback(queryStr);
        
        // 若官方系統真的掛了或查無資料，啟動民間圖資備援
        if (results.length === 0) {
          status.innerText = `官方圖資查無結果，切換至民間圖資比對...`;
          results = await fetchArcGIS(queryStr);
        }

        currentResults = results;

        if (currentResults.length === 0) {
          status.innerText = '所有圖資皆查無此門牌，建議直接點擊下方改用 Google Maps 模糊搜尋';
        } else {
          status.innerText = `找到 ${currentResults.length} 筆門牌，請在下方點選定位`;
          renderDropdown();
        }
      } catch (e) {
        status.innerText = '查詢發生錯誤，請檢查網路連線或稍後再試';
      }
    }

    function renderDropdown() {
      const dropdown = document.getElementById('dropdown');
      dropdown.innerHTML = currentResults.map((item, idx) => {
        const badge = item.source === 'official' 
          ? '<div class="badge-official">🎯 官方內政部精準圖資</div>'
          : '<div class="badge-fallback">📍 民間圖資概略位置</div>';
          
        return `
          <div class="dropdown-item" onclick="focusOnMap(${idx})">
            <div>
              <div class="item-addr">${item.addr}</div>
              ${badge}
            </div>
          </div>
        `;
      }).join('');
      dropdown.style.display = 'block';
    }

    function focusOnMap(idx) {
      const item = currentResults[idx];
      if (!item) return;
      
      document.getElementById('dropdown').style.display = 'none';
      document.getElementById('status').innerText = `📍已定位：${item.addr}`;

      markerLayer.clearLayers();
      const marker = L.marker([item.lat, item.lng]).addTo(markerLayer);
      
      const popupContent = `
        <div class="popup-content">
          <div class="popup-addr">${item.addr}</div>
          <div class="popup-coord">${item.lat}, ${item.lng}</div>
          <button class="btn-nav-big" onclick="launchGoogleMaps(${item.lat}, ${item.lng})">
            🧭 傳送至 Google Maps 導航
          </button>
        </div>
      `;
      
      marker.bindPopup(popupContent, { minWidth: 220 }).openPopup();
      map.flyTo([item.lat, item.lng], 19, { animate: true, duration: 1 });
    }

    function launchGoogleMaps(lat, lng) {
      const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
      window.open(navUrl, '_blank');
    }

    function openGoogleMapsFuzzy() {
      let raw = document.getElementById('addr').value.trim();
      const city = document.getElementById('city-filter').value;
      const town = document.getElementById('town-filter').value;
      const q = encodeURIComponent(`${city}${town}${raw}`);
      window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, '_blank');
    }

    window.onload = init;
  </script>
</body>
</html>
